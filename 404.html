<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Page not found — Check the Wind</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#E7EEF2; --text:#333333; --muted:#54697A; --link:#2060BE }
  @media (prefers-color-scheme: dark){ :root{ --bg:#0F1A22; --text:#E6EDF2; --muted:#A9BBC7; --link:#5CB4FF } }
  html,body{ height:100%; margin:0 }
  body{ display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; background:var(--bg); color:var(--text);
        font-family:'Nunito', system-ui, sans-serif; font-size:1.125rem; line-height:1.5; text-align:center }
  main{ max-width:30rem }
  h1{ margin:0 0 8px; font-size:1.75rem; font-weight:700 }
  p{ margin:0 0 20px; color:var(--muted) }
  a{ color:var(--link); font-weight:600 }
  a:focus-visible{ outline:2px solid var(--link); outline-offset:3px; border-radius:2px }
</style>
</head>
<body>
<main>
  <h1>That page blew away</h1>
  <p>We couldn’t find what you were looking for.</p>
  <a href="/">Check the wind</a>
</main>
</body>
</html>
