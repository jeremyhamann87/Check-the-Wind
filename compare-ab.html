<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Design A vs Design B</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1b2530; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .bar { display: flex; height: 44px; background: #10161e; color: #cfd8e3; align-items: center; padding: 0 12px; gap: 16px; font-size: 13px; }
  .bar label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .bar select { background: #243040; color: #eaf0f6; border: 1px solid #3a4a5c; border-radius: 4px; padding: 3px 6px; font-size: 13px; }
  .split { display: flex; width: 100%; height: calc(100% - 44px); }
  .pane { flex: 1 1 50%; display: flex; flex-direction: column; min-width: 0; border-right: 1px solid #000; overflow-x: auto; }
  .pane:last-child { border-right: none; }
  .pane-hdr { background: #2a3644; color: #eaf0f6; font-weight: 700; font-size: 13px; padding: 6px 10px; text-align: center; letter-spacing: .02em; }
  .pane iframe { flex: 1 1 auto; width: 100%; border: none; background: #fff; }
</style>
</head>
<body>
  <div class="bar">
    <strong style="color:#fff">Compare:</strong>
    <label>Width
      <select id="widthSel">
        <option value="">Fill pane</option>
        <option value="1280">Desktop · 1280</option>
        <option value="834">Tablet · 834</option>
        <option value="390">Mobile · 390</option>
      </select>
    </label>
  </div>
  <div class="split">
    <div class="pane">
      <div class="pane-hdr">Design A — windline.html</div>
      <iframe id="frameA" src="windline.html"></iframe>
    </div>
    <div class="pane">
      <div class="pane-hdr">Design B — windline-b.html</div>
      <iframe id="frameB" src="windline-b.html"></iframe>
    </div>
  </div>
  <script>
    var sel = document.getElementById('widthSel');
    var fa = document.getElementById('frameA');
    var fb = document.getElementById('frameB');
    sel.addEventListener('change', function(){
      var w = sel.value;
      [fa, fb].forEach(function(f){
        if (w) {
          f.style.width = w + 'px';
          f.style.maxWidth = w + 'px';
          f.style.margin = '0 auto';
          f.style.display = 'block';
        } else {
          f.style.width = '100%';
          f.style.maxWidth = 'none';
        }
      });
    });
  </script>
</body>
</html>
